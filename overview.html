<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alla bokningar</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="all-bookings-page">
        <a href="index.html" class="home-btn">Till startsidan</a>
        <h1 class="all-title">Alla bokningar</h1>

        <div class="bookings-layout">

            <div class="bookings-box">

                <div class="bookings-date">
                    22-03-2026 / Söndag
                </div>

                <div class="booking-item">
                    Lägenhet 12 / 9:00 - 12:00
                </div>

                <div class="booking-item">
                    Lägenhet 10 / 12:00 - 15:00
                </div>

                <div class="booking-item">
                    Lägenhet 8 / 15:00 - 18:00
                    <button class="cancel-btn">Avboka</button>
                </div>

            </div>

            <div class="booking-status">
                <p>Bokningen har genomförts</p>
            </div>

            <div class="booking-image">
                <img src="images/TM1.JPG" alt="Tvättmaskin">
            </div>

        </div>

    </div>

</body>
</html>
